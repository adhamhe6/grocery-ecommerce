name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, pytest on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: grocery, POSTGRES_PASSWORD: grocery, POSTGRES_DB: grocery }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grocery" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://grocery:grocery@127.0.0.1:5432/grocery
      REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements/*.txt }
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run
      - name: Django system check (production settings)
        run: python manage.py check --deploy --settings=config.settings.prod
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret-000000
          DJANGO_ALLOWED_HOSTS: localhost
      - name: Tests
        run: python -m pytest -q --cov=apps --cov-report=term-missing:skip-covered --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-coverage, path: backend/coverage.xml, if-no-files-found: ignore }

  frontend:
    name: Frontend (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  e2e:
    name: End-to-end (Playwright, 6 core workflows)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: grocery, POSTGRES_PASSWORD: grocery, POSTGRES_DB: grocery }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grocery" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://grocery:grocery@127.0.0.1:5432/grocery
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.dev
      CELERY_ALWAYS_EAGER: "true"
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements/*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements/dev.txt
      - name: Migrate and seed deterministic demo data
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
      - name: Start API
        working-directory: backend
        run: nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/api.log 2>&1 &
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start storefront
        working-directory: frontend
        run: |
          npm run build
          nohup npm start > /tmp/web.log 2>&1 &
        env: { BACKEND_INTERNAL_URL: "http://127.0.0.1:8000", NEXT_PUBLIC_SITE_URL: "http://localhost:3000" }
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
        env: { E2E_BASE_URL: "http://localhost:3000" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/api.log
            /tmp/web.log
          if-no-files-found: ignore

  docker:
    name: Docker images and Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          sed -i "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=ci-only-not-a-secret-ci-only-not-a-secret-000000|; s|^PAYMENT_WEBHOOK_SECRET=.*|PAYMENT_WEBHOOK_SECRET=ci-only|; s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-only|" .env
          docker compose config -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ./backend, push: false, load: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ./frontend, push: false, load: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
