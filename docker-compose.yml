# Orchard Row — local production-like stack.
#   make env && docker compose up --build        (then: make seed)
# Browsers only talk to the storefront (:3000); it proxies /api and /media to the backend.
name: orchardrow

x-backend: &backend
  build: { context: ./backend }
  image: orchardrow-backend:local
  restart: unless-stopped
  environment: &backend-env
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?run `make env` to generate .env}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
    DATABASE_URL: postgres://grocery:${POSTGRES_PASSWORD:?run `make env` to generate .env}@postgres:5432/grocery
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    FRONTEND_URL: ${SITE_URL:-http://localhost:3000}
    BACKEND_PUBLIC_URL: http://backend:8000
    MEDIA_ROOT: /data/media
    SERVE_MEDIA: "true" # demo/single-host only; use object storage or a CDN in production
    SECURE_COOKIES: ${SECURE_COOKIES:-true}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
    SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
    PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-demo}
    PAYMENTS_ALLOW_DEMO: ${PAYMENTS_ALLOW_DEMO:-false}
    PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?run `make env` to generate .env}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
    EMAIL_HOST: ${EMAIL_HOST:-}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Orchard Row <orders@example.invalid>}
    TIME_ZONE: ${TIME_ZONE:-UTC}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    - media:/data/media

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: grocery
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `make env` to generate .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery -d grocery"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000" # API + /api/docs; the storefront reaches it on the internal network

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    image: orchardrow-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "3000:3000"

  # One-off tasks: `docker compose --profile tools run --rm seed`
  seed:
    <<: *backend
    profiles: ["tools"]
    restart: "no"
    command: ["python", "manage.py", "seed_demo", "--yes-i-know-this-is-demo-data"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  redisdata:
  media:
